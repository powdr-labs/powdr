name: PR tests

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

# cancel any previous running workflows for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  POWDR_OPENVM_SEGMENT_DELTA: 50000
  # Route APC generation through the Lean apc-optimizer (linked via the
  # `lean-optimizer` cargo feature, selected at runtime by this env var).
  POWDR_USE_LEAN_OPTIMIZER: "1"

jobs:
  build_cpu:
    runs-on: warp-ubuntu-2404-x64-8x

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: ⚡ Restore rust cache
        id: cache
        uses: WarpBuilds/cache/restore@v1
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            Cargo.lock
            ~/.cargo/powdr-apc-optimizer/
          key: ${{ runner.os }}-cargo-pr-tests
      # The Lean apc-optimizer's managed checkout (clone + ~1200 compiled
      # mathlib objects under .lake/) lives here; cache it keyed on build.rs so a
      # `lake build` from scratch only happens when the pinned revision changes.
      - name: ⚡ Cache apc-optimizer (Lean) checkout
        uses: actions/cache@v4
        with:
          path: ~/.cargo/powdr-apc-optimizer
          key: ${{ runner.os }}-apc-optimizer-${{ hashFiles('autoprecompiles-lean-ffi/build.rs') }}
      - name: Date of the restored cache
        run: cat target/cache-build-date.txt
        continue-on-error: true
      - name: Check out cache commit state and update mtime accordingly.
        run: git checkout "$(cat target/cache-commit-hash.txt || echo 'f02fd626e2bb9e46a22ea1cda96b4feb5c6bda43')" && git ls-files -z | xargs -0 -n1 touch -d "Fri, 18 Apr 2025 03:30:58 +0000" && git checkout HEAD@{1}

      ##### The block below is shared between cache build and PR build workflows #####
      - name: Install Rust toolchain nightly-2025-10-01 (with clippy and rustfmt)
        run: rustup toolchain install nightly-2025-10-01 --component clippy,rustfmt
      - name: Install Rust toolchain 1.91.1 (stable)
        run: rustup toolchain install 1.91.1
      - name: Install Lean toolchain (elan)
        # The `lean-optimizer` feature links the Lean apc-optimizer via FFI, whose
        # build script needs `lean`/`lake`.
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set cargo to perform shallow clones
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV
      - name: Format
        run: cargo fmt --all --check --verbose
      - name: Cargo check with Rust 1.91.1 (default features)
        run: cargo +1.91.1 check --all-targets
      - name: Lint no default features
        run: cargo clippy --all --all-targets --features metrics,aot --profile pr-tests --verbose -- -D warnings
      - name: Build (CPU)
        run: cargo build --all-targets --features metrics,aot --all --profile pr-tests --verbose
      ###############################################################################

      - uses: taiki-e/install-action@nextest
      - name: Create tests archive (CPU)
        # Build with `lean-optimizer` so the snapshot tests (and any other test
        # that generates APCs) run through the Lean apc-optimizer, selected at
        # runtime by POWDR_USE_LEAN_OPTIMIZER.
        run: cargo nextest archive --archive-file tests_cpu.tar.zst --cargo-profile pr-tests --workspace --no-default-features --features lean-optimizer
      - name: Upload build artifacts (CPU)
        uses: actions/upload-artifact@v4
        with:
          name: tests_archive_cpu
          path: |
            tests_cpu.tar.zst

  test_quick_cpu:
    needs: build_cpu
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        test:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Init testing instance
        uses: ./.github/actions/init-testing-instance
      - name: Run default tests
        run: cargo nextest run --archive-file tests_cpu.tar.zst --workspace-remap . --verbose --partition count:"${{ matrix.test }}"/7 --no-tests=warn

  test_medium_cpu:
    needs: build_cpu
    runs-on: warp-ubuntu-2404-x64-16x
    strategy:
      matrix:
        test:
          - "1"
          - "2"
          - "3"
          - "4"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Init testing instance
        uses: ./.github/actions/init-testing-instance
      - name: Run medium tests (ignored tests except large ones)
        run: cargo nextest run --archive-file tests_cpu.tar.zst --workspace-remap . --verbose --partition count:"${{ matrix.test }}"/7 --test-threads=4 -E 'not (test(_large))' --run-ignored only --no-tests=warn

  test_large_cpu:
    needs: build_cpu
    runs-on: warp-ubuntu-2404-x64-32x

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Init testing instance
        uses: ./.github/actions/init-testing-instance
      - name: Run large tests
        run: cargo nextest run --archive-file tests_cpu.tar.zst --workspace-remap . --verbose -E 'test(_large)' --run-ignored only --no-tests=warn

  # sp1-benchmarks is a standalone workspace (excluded so its SP1 dep's plonky3 can't clash with openvm's in a shared lockfile), so it's not in the --workspace archive above and needs its own job + cache.
  test_sp1_benchmarks:
    runs-on: warp-ubuntu-2404-x64-8x

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ⚡ Rust cache (sp1-benchmarks)
        uses: WarpBuilds/cache@v1
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            sp1-benchmarks/target/
          key: ${{ runner.os }}-cargo-sp1-benchmarks-${{ hashFiles('sp1-benchmarks/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-sp1-benchmarks-
      # The Lean apc-optimizer's managed checkout (clone + compiled mathlib
      # objects) lives here; cache it keyed on build.rs so a `lake build` from
      # scratch only happens when the pinned revision changes.
      - name: ⚡ Cache apc-optimizer (Lean) checkout
        uses: actions/cache@v4
        with:
          path: ~/.cargo/powdr-apc-optimizer
          key: ${{ runner.os }}-apc-optimizer-${{ hashFiles('autoprecompiles-lean-ffi/build.rs') }}
      - name: Install Rust toolchain 1.91.1 (stable)
        run: rustup toolchain install 1.91.1
      - name: Install Lean toolchain (elan)
        # The `lean-optimizer` feature links the Lean apc-optimizer via FFI, whose
        # build script needs `lean`/`lake`.
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set cargo to perform shallow clones
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV
      - name: Test sp1-benchmarks (standalone workspace)
        # Route sp1-benchmarks' APC generation through the Lean apc-optimizer
        # (feature links the FFI; POWDR_USE_LEAN_OPTIMIZER selects it at runtime).
        run: cargo +1.91.1 test --manifest-path sp1-benchmarks/Cargo.toml --release --features powdr-autoprecompiles/lean-optimizer

  udeps_cpu:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Run cargo-udeps (CPU)
        run: cargo udeps --all-targets

  # NOTE: test_apc_reth_compilation has been moved to pr-tests-with-secrets.yml
  # This job requires secrets.RPC_1 and uses pull_request_target to work with external PRs

  build_gpu:
    # Not part of the default PR run for now; dispatch manually when needed.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, gpu-shared]
    # Building the test archive links the Lean apc-optimizer FFI, which recompiles
    # from scratch on the first run after a rev bump; the persistent apc-optimizer
    # checkout keeps later runs fast. Give it headroom.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust toolchain nightly-2025-10-01 (with clippy and rustfmt)
        run: rustup toolchain install nightly-2025-10-01 --component clippy,rustfmt
      - name: Install Rust toolchain 1.91.1 (stable)
        run: rustup toolchain install 1.91.1
      - name: Install Lean toolchain (elan)
        # The `lean-optimizer` feature links the Lean apc-optimizer via FFI, whose
        # build script needs `lean`/`lake`.
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Set cargo to perform shallow clones
        run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV
      - name: Format
        run: cargo fmt --all --check --verbose
      - name: Cargo check with Rust 1.91.1 (all features)
        run: cargo +1.91.1 check --all-targets
      - name: Lint no default features
        run: cargo clippy --all --all-targets --features cuda,metrics,aot --profile pr-tests --verbose -- -D warnings
      - name: Build (GPU)
        run: cargo build --all-targets --features cuda,metrics,aot --all --profile pr-tests --verbose
      - uses: taiki-e/install-action@nextest
      - name: Create tests archive (GPU, features=cuda)
        # `lean-optimizer` routes GPU tests' APC generation through the Lean
        # apc-optimizer (selected at runtime by POWDR_USE_LEAN_OPTIMIZER).
        run: cargo nextest archive --archive-file tests_gpu.tar.zst --cargo-profile pr-tests --workspace --package powdr-openvm-riscv --features cuda,lean-optimizer
      - name: Upload build artifacts (GPU)
        uses: actions/upload-artifact@v4
        with:
          name: tests_archive_gpu
          path: |
            tests_gpu.tar.zst

  test_quick_gpu:
    # Not part of the default PR run for now; dispatch manually when needed.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build_gpu
    runs-on: [self-hosted, gpu-shared]
    timeout-minutes: 30
    # TODO: we only have one runner on our GPU server, so can't partition yet; uncomment these once we have proper runners
    # strategy:
    #   matrix:
    #     test:
    #       - "1"
    #       - "2"
    #       - "3"
    #       - "4"
    #       - "5"
    #       - "6"
    #       - "7"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Init testing instance (GPU)
        uses: ./.github/actions/init-testing-instance-gpu
      - name: Run quick GPU tests from powdr-openvm-riscv only
        # Cap parallelism so concurrent GPU allocations fit in ~20 GiB of device
        # memory on our shared runner. Heavy APC tests can each consume several
        # GiB, so we run at most 4 at a time.
        run: cargo nextest run --archive-file tests_gpu.tar.zst --workspace-remap . --verbose --no-tests=warn --test-threads=4
        # run: cargo nextest run --archive-file tests_gpu.tar.zst --workspace-remap . --verbose --partition count:"${{ matrix.test }}"/7 --no-tests=warn

  # NOTE: test_apc_reth_app_proof has been moved to pr-tests-with-secrets.yml
  # This job requires secrets.RPC_1 and uses pull_request_target to work with external PRs

