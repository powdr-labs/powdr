name: "Patch openvm-eth"
description: "Checks out powdr-labs/openvm-eth at a fixed ref and patches it to use local powdr crates"

runs:
  using: "composite"
  steps:
    - name: Checkout openvm-eth
      uses: actions/checkout@v4
      with:
        repository: powdr-labs/openvm-eth
        # Set once here — no inputs required elsewhere.
        ref: b4204ea4e28298744088492b24062bf247cec122
        path: openvm-eth

    # powdr's drop-hint branch pulls openvm from the fork's drop-hints branch,
    # while openvm-eth redirects upstream openvm-org/openvm to the fork's
    # v2.0.0-beta.2-powdr.1 tag via its manifest [patch] table. Cargo refuses a
    # graph with two revisions of the same source (links conflict), so check
    # the fork branch out and unify every route onto one path checkout.
    - name: Checkout openvm fork (drop-hints)
      uses: actions/checkout@v4
      with:
        repository: powdr-labs/openvm
        ref: drop-hints
        path: openvm-fork

    # The openvm unification tables go into openvm-eth's MANIFEST, not the
    # config: the standalone stateless-guest workspace inherits
    # .cargo/config.toml, and its (nightly) guest build chokes while loading
    # config-level openvm path patch entries ("error inheriting rust-version
    # from workspace root"). Manifest patches are invisible to the guest, which
    # keeps building against its own committed lock exactly as before. The
    # config keeps only the powdr table, as it always had.
    - name: Patch openvm-eth to use local powdr and the openvm fork
      shell: bash
      run: |
        cd openvm-eth
        mkdir -p .cargo
        cat <<'EOF' > .cargo/config.toml
        [patch."https://github.com/powdr-labs/powdr.git"]
        powdr-openvm-riscv = { path = "../openvm-riscv" }
        powdr-openvm = { path = "../openvm" }
        powdr-riscv-elf = { path = "../riscv-elf" }
        powdr-number = { path = "../number" }
        powdr-autoprecompiles = { path = "../autoprecompiles" }
        powdr-openvm-riscv-hints-circuit = { path = "../openvm-riscv/extensions/hints-circuit" }
        EOF

        python3 - <<'PYEOF2'
        import re
        crate_dirs = {
            "k256": "guest-libs/k256",
            "openvm": "crates/toolchain/openvm",
            "openvm-algebra-circuit": "extensions/algebra/circuit",
            "openvm-algebra-complex-macros": "extensions/algebra/complex-macros",
            "openvm-algebra-guest": "extensions/algebra/guest",
            "openvm-algebra-moduli-macros": "extensions/algebra/moduli-macros",
            "openvm-algebra-transpiler": "extensions/algebra/transpiler",
            "openvm-benchmarks-prove": "benchmarks/prove",
            "openvm-bigint-circuit": "extensions/bigint/circuit",
            "openvm-bigint-guest": "extensions/bigint/guest",
            "openvm-bigint-transpiler": "extensions/bigint/transpiler",
            "openvm-build": "crates/toolchain/build",
            "openvm-circuit": "crates/vm",
            "openvm-circuit-derive": "crates/vm/derive",
            "openvm-circuit-primitives": "crates/circuits/primitives",
            "openvm-circuit-primitives-derive": "crates/circuits/primitives/derive",
            "openvm-continuations": "crates/continuations",
            "openvm-custom-insn": "crates/toolchain/custom_insn",
            "openvm-deferral-circuit": "extensions/deferral/circuit",
            "openvm-deferral-guest": "extensions/deferral/guest",
            "openvm-deferral-transpiler": "extensions/deferral/transpiler",
            "openvm-ecc-circuit": "extensions/ecc/circuit",
            "openvm-ecc-guest": "extensions/ecc/guest",
            "openvm-ecc-sw-macros": "extensions/ecc/sw-macros",
            "openvm-ecc-transpiler": "extensions/ecc/transpiler",
            "openvm-instructions": "crates/toolchain/instructions",
            "openvm-instructions-derive": "crates/toolchain/instructions/derive",
            "openvm-keccak256": "guest-libs/keccak256",
            "openvm-keccak256-circuit": "extensions/keccak256/circuit",
            "openvm-keccak256-guest": "extensions/keccak256/guest",
            "openvm-keccak256-transpiler": "extensions/keccak256/transpiler",
            "openvm-macros-common": "crates/toolchain/macros",
            "openvm-mod-circuit-builder": "crates/circuits/mod-builder",
            "openvm-pairing": "guest-libs/pairing",
            "openvm-pairing-circuit": "extensions/pairing/circuit",
            "openvm-pairing-guest": "extensions/pairing/guest",
            "openvm-pairing-transpiler": "extensions/pairing/transpiler",
            "openvm-platform": "crates/toolchain/platform",
            "openvm-poseidon2-air": "crates/circuits/poseidon2-air",
            "openvm-recursion-circuit": "crates/recursion",
            "openvm-recursion-circuit-derive": "crates/recursion/derive",
            "openvm-rv32-adapters": "extensions/rv32-adapters",
            "openvm-rv32im-circuit": "extensions/rv32im/circuit",
            "openvm-rv32im-guest": "extensions/rv32im/guest",
            "openvm-rv32im-transpiler": "extensions/rv32im/transpiler",
            "openvm-sdk": "crates/sdk",
            "openvm-sdk-config": "crates/sdk-config",
            "openvm-sha2": "guest-libs/sha2",
            "openvm-sha2-air": "crates/circuits/sha2-air",
            "openvm-sha2-circuit": "extensions/sha2/circuit",
            "openvm-sha2-guest": "extensions/sha2/guest",
            "openvm-sha2-transpiler": "extensions/sha2/transpiler",
            "openvm-static-verifier": "crates/static-verifier",
            "openvm-transpiler": "crates/toolchain/transpiler",
            "openvm-verify-stark-host": "crates/verify",
            "p256": "guest-libs/p256"
        }
        s = open("Cargo.toml").read()

        # 1. Rewrite the existing [patch."openvm-org/openvm.git"] entries in place
        #    from the fork tag to the fork checkout.
        def repl(m):
            key, pkg = m.group(1), m.group(3) or m.group(1)
            d = crate_dirs[pkg]
            pkg_attr = ', package = "%s"' % pkg if m.group(3) else ""
            return '%s = { path = "../openvm-fork/%s"%s }' % (key, d, pkg_attr)
        pattern = re.compile(
            r'^(\S+) = \{ git = "https://github\.com/powdr-labs/openvm\.git"'
            r'(, package = "([^"]+)")?, tag = "v2\.0\.0-beta\.2-powdr\.1" \}',
            re.M,
        )
        s, n = pattern.subn(repl, s)
        assert n > 0, "no manifest patch entries rewritten - did openvm-eth patch table change?"

        # 2. Append a table folding powdr's direct branch references onto the same copy.
        s = s.rstrip() + '\n\n[patch."https://github.com/powdr-labs/openvm.git"]\n'
        for name, d in sorted(crate_dirs.items()):
            s += '%s = { path = "../openvm-fork/%s" }\n' % (name, d)
        open("Cargo.toml", "w").write(s)
        print("rewrote", n, "entries; appended powdr-labs table")
        PYEOF2
