name: PR tests (with secrets)

# This workflow uses pull_request_target to allow external PRs to access secrets
# after a maintainer approves the workflow run
#
# SECURITY NOTE: This workflow intentionally checks out untrusted code from PRs
# to run tests with secrets. This is safe because:
# 1. GitHub requires maintainer approval before running for external contributors
# 2. The workflow code itself (this file) is controlled and runs from base branch
# 3. We only run predefined build/test commands, not arbitrary PR code
# 4. Cache poisoning risk is acceptable for these specific test jobs
on:
  # also allow this to be run manually (so we can test changes to the workflow in a branch)
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]

# cancel any previous running workflows for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  POWDR_OPENVM_SEGMENT_DELTA: 50000
  # Route APC generation through the Lean apc-optimizer (enabled in openvm-eth's
  # FEATURES below; selected at runtime by this env var).
  POWDR_USE_LEAN_OPTIMIZER: "1"
  # The Lean apc-optimizer recurses deeply; give worker threads a 512 MiB stack.
  RUST_MIN_STACK: "536870912"

jobs:
  test_apc_reth_compilation:
    runs-on: warp-ubuntu-2404-x64-8x

    steps:
      # IMPORTANT: Checkout the PR head, not the base branch
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
      - name: ⚡ Cache rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
      # The Lean apc-optimizer's managed checkout (clone + compiled mathlib
      # objects) lives here; cache it keyed on build.rs so a `lake build` from
      # scratch only happens when the pinned revision changes.
      - name: ⚡ Cache apc-optimizer (Lean) checkout
        uses: actions/cache@v4
        with:
          path: ~/.cargo/powdr-apc-optimizer
          key: ${{ runner.os }}-apc-optimizer-${{ hashFiles('autoprecompiles-lean-ffi/build.rs') }}
      - name: Build
        run: cargo build --release -p powdr-openvm

      - name: Install cargo openvm
        # `--locked` pins dependencies to the Cargo.lock of the openvm tag; without it,
        # freshly-released dependency versions can require a newer rustc than 1.91.1.
        run: |
          rustup toolchain install 1.91.1
          cargo +1.91.1 install --locked --git 'https://github.com/powdr-labs/openvm.git' --tag "v2.0.0-beta.2-powdr" cargo-openvm

      - name: Install OpenVM guest toolchain
        # `cargo openvm build` invokes `cargo +nightly-2026-01-18 build --target
        # riscv32im-risc0-zkvm-elf -Z build-std=...`, which needs both the
        # nightly toolchain and its `rust-src` component.
        run: |
          rustup toolchain install nightly-2026-01-18
          rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Patch benchmark
        uses: ./.github/actions/patch-openvm-eth

      - name: Install Lean toolchain (elan) + enable it in openvm-eth
        # The `lean-optimizer` feature links the Lean apc-optimizer via FFI (needs
        # `lean`/`lake`); add it to openvm-eth's FEATURES so its APC generation is
        # routed through the Lean optimizer (selected at runtime by
        # POWDR_USE_LEAN_OPTIMIZER).
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          perl -i -pe 's{^FEATURES="parallel,metrics,jemalloc,unprotected"$}{FEATURES="parallel,metrics,jemalloc,unprotected,powdr-openvm/lean-optimizer,powdr-openvm-riscv/lean-optimizer"}' openvm-eth/run.sh
          grep -q 'lean-optimizer' openvm-eth/run.sh || { echo "failed to patch openvm-eth FEATURES for lean-optimizer"; exit 1; }

      - name: Run small execution test with APCs
        run: |
          cd openvm-eth
          echo "export RPC_1=${{ secrets.RPC_1 }}" >> .env
          PGO_TYPE="instruction" /usr/bin/time -v ./run.sh --apc 10 --mode compile

      # Check that reth commit is on main.
      # Do that after the actual test so that the step above passes when checking that a
      # reth PR commit works with a powdr PR.
      - name: Verify openvm-eth ref is on main
        shell: bash
        run: |
          cd openvm-eth
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --unshallow origin main
          else
            git fetch --quiet origin main
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Pinned ref is not in origin/main history."
            echo "HEAD: $(git rev-parse HEAD)"
            echo "origin/main: $(git rev-parse origin/main)"
            exit 1
          fi

  test_apc_reth_app_proof:
    runs-on: warp-ubuntu-2404-x64-32x

    steps:
      # IMPORTANT: Checkout the PR head, not the base branch
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: ⚡ Cache rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-apc-reth-app-proof-${{ hashFiles('**/Cargo.toml') }}

      # The Lean apc-optimizer's managed checkout (clone + compiled mathlib
      # objects) lives here; cache it keyed on build.rs so a `lake build` from
      # scratch only happens when the pinned revision changes.
      - name: ⚡ Cache apc-optimizer (Lean) checkout
        uses: actions/cache@v4
        with:
          path: ~/.cargo/powdr-apc-optimizer
          key: ${{ runner.os }}-apc-optimizer-${{ hashFiles('autoprecompiles-lean-ffi/build.rs') }}
      - name: Build
        run: cargo build --release -p powdr-openvm

      - name: Install cargo openvm
        # `--locked` pins dependencies to the Cargo.lock of the openvm tag; without it,
        # freshly-released dependency versions can require a newer rustc than 1.91.1.
        run: |
          rustup toolchain install 1.91.1
          cargo +1.91.1 install --locked --git 'https://github.com/powdr-labs/openvm.git' --tag "v2.0.0-beta.2-powdr" cargo-openvm

      - name: Install OpenVM guest toolchain
        # `cargo openvm build` invokes `cargo +nightly-2026-01-18 build --target
        # riscv32im-risc0-zkvm-elf -Z build-std=...`, which needs both the
        # nightly toolchain and its `rust-src` component.
        run: |
          rustup toolchain install nightly-2026-01-18
          rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Setup python venv
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r openvm-riscv/scripts/requirements.txt
          pip install -r autoprecompiles/scripts/requirements.txt

      - name: Patch benchmark
        uses: ./.github/actions/patch-openvm-eth

      - name: Install Lean toolchain (elan) + enable it in openvm-eth
        # The `lean-optimizer` feature links the Lean apc-optimizer via FFI (needs
        # `lean`/`lake`); add it to openvm-eth's FEATURES so its APC generation is
        # routed through the Lean optimizer (selected at runtime by
        # POWDR_USE_LEAN_OPTIMIZER).
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          perl -i -pe 's{^FEATURES="parallel,metrics,jemalloc,unprotected"$}{FEATURES="parallel,metrics,jemalloc,unprotected,powdr-openvm/lean-optimizer,powdr-openvm-riscv/lean-optimizer"}' openvm-eth/run.sh
          grep -q 'lean-optimizer' openvm-eth/run.sh || { echo "failed to patch openvm-eth FEATURES for lean-optimizer"; exit 1; }

      - name: Run reth benchmark
        run: |
          source .venv/bin/activate
          cd openvm-eth
          RES_DIR=reth
          mkdir -p $RES_DIR
          echo "export RPC_1=${{ secrets.RPC_1 }}" >> .env

          # Prove with 3 APCs. Block 24171384 has ~5M gas.
          APC=3 ./run.sh --mode prove-app --block 24171384 || exit 1
          echo "Finished proving with 3 APCs"
