name: Post-merge APC tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**.rs"
      - "**.toml"

env:
  CARGO_TERM_COLOR: always
  # NOTE: intentionally no `RUSTFLAGS: -C target-cpu=native` here. This job
  # builds the riscv32 guest via `cargo openvm build`, which inherits ambient
  # RUSTFLAGS; a host `target-cpu=native` is then rejected by rustc-LLVM with
  # "RV32 target requires an RV32 CPU". Mirrors the note in nightly-tests.yml.
  RUST_BACKTRACE: 1
  JEMALLOC_SYS_WITH_MALLOC_CONF: "retain:true,background_thread:true,metadata_thp:always,dirty_decay_ms:10000,muzzy_decay_ms:10000,abort_conf:true"
  POWDR_OPENVM_SEGMENT_DELTA: 50000
  # Route APC generation through the Lean apc-optimizer (linked via the
  # `lean-optimizer` cargo feature, selected at runtime by this env var).
  POWDR_USE_LEAN_OPTIMIZER: "1"
  # The Lean apc-optimizer recurses deeply; give worker threads a 512 MiB stack.
  RUST_MIN_STACK: "536870912"

jobs:
  test_guests_apc:
    runs-on: server-dev

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ⚡ Cache rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-apc-${{ hashFiles('**/Cargo.toml') }}

      # The Lean apc-optimizer's managed checkout (clone + compiled mathlib
      # objects) lives here; cache it keyed on build.rs so a `lake build` from
      # scratch only happens when the pinned revision changes.
      - name: ⚡ Cache apc-optimizer (Lean) checkout
        uses: actions/cache@v4
        with:
          path: ~/.cargo/powdr-apc-optimizer
          key: ${{ runner.os }}-apc-optimizer-${{ hashFiles('autoprecompiles-lean-ffi/build.rs') }}

      - name: Build
        run: cargo build --release -p powdr-openvm

      - name: Install cargo openvm
        # `--locked` pins dependencies to the Cargo.lock of the openvm tag; without it,
        # freshly-released dependency versions can require a newer rustc than 1.91.1.
        run: |
          rustup toolchain install 1.91.1
          cargo +1.91.1 install --locked --git 'https://github.com/powdr-labs/openvm.git' --tag "v2.0.0-beta.2-powdr" cargo-openvm

      - name: Install OpenVM guest toolchain
        # `cargo openvm build` invokes `cargo +nightly-2026-01-18 build --target
        # riscv32im-risc0-zkvm-elf -Z build-std=...`, which needs both the
        # nightly toolchain and its `rust-src` component.
        run: |
          rustup toolchain install nightly-2026-01-18
          rustup component add rust-src --toolchain nightly-2026-01-18

      - name: Install Lean toolchain (elan)
        # The `lean-optimizer` feature links the Lean apc-optimizer via FFI, whose
        # build script needs `lean`/`lake`.
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Run keccak with 100 APCs
        run: /usr/bin/time -v cargo run --bin powdr_openvm_riscv -r --features lean-optimizer prove guest-keccak --profile-input 10000 --input 10000 --autoprecompiles 100 --recursion

      - name: Run ECC with 100 APCs
        run: /usr/bin/time -v cargo run --bin powdr_openvm_riscv -r --features lean-optimizer prove guest-ecc-powdr-affine-hint --profile-input 20 --input 20 --autoprecompiles 100 --recursion

      - name: Run ecrecover with 100 APCs
        run: /usr/bin/time -v cargo run --bin powdr_openvm_riscv -r --features lean-optimizer prove guest-ecrecover --profile-input 20 --input 20 --autoprecompiles 100 --recursion

      - name: Patch benchmark
        uses: ./.github/actions/patch-openvm-eth

      - name: Run reth benchmark
        run: |
          cd openvm-eth
          RES_DIR=reth
          mkdir -p $RES_DIR
          echo "export RPC_1=${{ secrets.RPC_1 }}" >> .env

          # Prove with 100 APCs. Block 24171384 has ~5M gas. `--lean-optimizer`
          # routes APC generation through the Lean apc-optimizer.
          /usr/bin/time -v ./run.sh --lean-optimizer --apc 100  --mode prove-stark --block 24171384 || exit 1
          echo "Finished proving with 100 APCs"

      - name: Save revisions and run info
        run: |
          echo "openvm-eth: $(git -C openvm-eth rev-parse HEAD)" > run.txt
          echo "powdr: $(git rev-parse HEAD)" >> run.txt
          echo "run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> run.txt

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            run.txt
